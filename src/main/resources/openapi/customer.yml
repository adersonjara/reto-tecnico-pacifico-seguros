openapi: 3.0.3

info:
  title: Customer API
  description: >
    Development of a Reactive Microservice for Customer Management.

  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Environment

tags:
  - name: Customers
    description: Customer management operations

paths:

  /api/customers:

    post:
      tags:
        - Customers
      summary: Create customer
      operationId: createCustomer

      requestBody:
        required: true

        content:
          application/json:

            schema:
              $ref: '#/components/schemas/CustomerRequest'

      responses:

        '201':
          description: Customer created

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/CustomerResponse'

        '400':
          description: Invalid request

    get:
      tags:
        - Customers

      summary: Get all customers

      operationId: findAllCustomers

      responses:

        '200':

          description: Customer list

          content:

            application/json:

              schema:
                type: array

                items:
                  $ref: '#/components/schemas/CustomerResponse'

  /api/customers/{id}:

    get:

      tags:
        - Customers

      summary: Get customer by id

      operationId: findCustomerById

      parameters:

        - name: id
          in: path
          required: true

          schema:
            type: integer
            format: int64

      responses:

        '200':

          description: Customer found

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/CustomerResponse'

        '404':
          description: Customer not found

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:

      tags:
        - Customers

      summary: Update customer

      operationId: updateCustomer

      parameters:

        - name: id

          in: path

          required: true

          schema:
            type: integer
            format: int64

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: '#/components/schemas/CustomerRequest'

      responses:

        '200':
          description: Customer updated

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/CustomerResponse'

        '404':
          description: Customer not found

    delete:

      tags:
        - Customers

      summary: Delete customer

      operationId: deleteCustomer

      parameters:

        - name: id

          in: path

          required: true

          schema:
            type: integer
            format: int64

      responses:

        '204':
          description: Customer deleted

        '404':
          description: Customer not found

components:

  schemas:

    CustomerRequest:

      type: object

      required:
        - firstName
        - lastName
        - email

      properties:

        firstName:
          type: string
          example: "Aderson"

        lastName:
          type: string
          example: "Jara"

        email:
          type: string
          format: email
          example: "aderson@gmail.com"

        phone:
          type: string
          example: "987654893"

    CustomerResponse:

      type: object

      properties:

        id:
          type: integer
          format: int64
          example: 1

        firstName:
          type: string
          example: "Aderson"

        lastName:
          type: string
          example: "Jara"

        email:
          type: string
          format: email
          example: "aderson@gmail.com"

        phone:
          type: string
          example: "987654893"

        active:
          type: boolean
          example: true

    ErrorResponse:

      type: object

      properties:

        message:
          type: string
          example: "Customer not found with id: 100"

        timestamp:
          type: string
          format: date-time
          example: 2026-10-28T22:00:00